<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Playlist Shop</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link fs-5" href="/">songs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fs-5" href="/playlist">playlists</a>
                </li>
            </ul>

            <div class="d-flex text-white align-items-center">
                <div sec:authorize="isAnonymous()">
                    <a href="/login" class="btn btn-outline-light me-2">로그인</a>
                    <a href="/join" class="btn btn-warning">회원가입</a>
                </div>
                <div sec:authorize="isAuthenticated()">
                    <a href="/cart" class="btn btn-outline-success position-relative me-3">
                        <i class="bi bi-cart-fill"></i> 장바구니
                    </a>
                    <span class="me-3 text-light">
                        <span sec:authentication="name" class="fw-bold text-warning">User</span>님
                    </span>
                    <a href="/logout" class="btn btn-sm btn-outline-secondary">로그아웃</a>
                </div>
            </div>
        </div>
    </div>
</nav>
</html>
