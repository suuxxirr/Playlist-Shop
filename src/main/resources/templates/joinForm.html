<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Playlist Shop - 회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .form-container { max-width: 500px; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/header :: header}"></nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4 fw-bold">회원가입</h2>

                    <form action="/join" method="post" th:object="${userJoinRequestDto}">

                        <div class="form-floating mb-3">
                            <input type="text" id="nickname" th:field="*{nickname}"
                                   class="form-control" th:errorclass="is-invalid"
                                   placeholder="닉네임">
                            <label for="nickname">닉네임</label>
                            <div class="invalid-feedback" th:errors="*{nickname}">
                                닉네임 오류 메시지
                            </div>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" id="password" th:field="*{password}"
                                   class="form-control" th:errorclass="is-invalid"
                                   placeholder="비밀번호">
                            <label for="password">비밀번호</label>
                            <div class="invalid-feedback" th:errors="*{password}">
                                비밀번호 오류 메시지
                            </div>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="email" id="mail" th:field="*{mail}"
                                   class="form-control" th:errorclass="is-invalid"
                                   placeholder="이메일">
                            <label for="mail">이메일</label>
                            <div class="invalid-feedback" th:errors="*{mail}">
                                이메일 오류 메시지
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2 fs-5 fw-bold">가입하기</button>

                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <span class="text-muted">이미 계정이 있으신가요?</span>
                <a href="/login" class="text-decoration-none fw-bold text-dark ms-1">로그인</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
