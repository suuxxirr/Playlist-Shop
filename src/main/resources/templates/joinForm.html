<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        .field-error {
            border-color: #dc3545;
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<h1>회원가입</h1>

<form action="/join" method="post" th:object="${userJoinRequestDto}">
    <div>
        <label for="nickname">닉네임:</label>
        <input type="text" id="nickname" th:field="*{nickname}"
                th:errorclass="field-error" placeholder="닉네임을 입력하세요">
        <div class="field-error" th:errors="*{nickname}">닉네임 오류 메시지</div>
    </div>
    <div>
        <label for="password">비밀번호:</label>
        <input type="password" id="password" th:field="*{password}"
               th:errorclass="field-error" placeholder="비밀번호를 입력하세요">
        <div class="field-error" th:errors="*{password}">이메일 오류 메시지</div>
    </div>
    <div>
        <label for="mail">이메일:</label>
        <input type="email" id="mail" th:field="*{mail}"
               th:errorclass="field-error" placeholder="이메일을 입력하세요">
        <div class="field-error" th:errors="*{mail}">이메일 오류 메시지</div>
    </div>
    <button type="submit">가입하기</button>
</form>
</body>
</html>
