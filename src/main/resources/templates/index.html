
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Playlist Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-img-top {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">
    <h2 class="mb-4 fw-bold">추천 음악 목록</h2>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col" th:each="song : ${songs}">
            <div class="card h-100 shadow-sm border-0">

                <a th:href="@{/song/{id}(id=${song.id})}" class="text-decoration-none">
                    <img th:src="${song.albumartUrl}" class="card-img-top" alt="앨범아트">
                </a>

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold text-dark" th:text="${song.title}"
                        style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        노래 제목
                    </h5>
                    <p class="card-text text-secondary mb-3" th:text="${song.artist}">가수 이름</p>

                    <div class="mt-auto d-flex justify-content-between align-items-center">

                        <span class="fw-bold text-primary fs-5" th:text="|${song.price}원|">500원</span>

                        <div class="d-flex gap-2"> <button class="btn btn-outline-danger btn-sm"
                                                           th:onclick="|location.href='@{/like/{id}(id=${song.id})}'|">
                            <i class="bi bi-heart-fill"></i> ❤️ <span th:text="${song.likeCount}">0</span>
                        </button>

                            <a th:href="@{/song/{id}(id=${song.id})}" class="btn btn-primary btn-sm">
                                상세
                            </a>
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-light border-top-0">
                    <small class="text-muted" th:text="|${song.album}|">앨범명</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
