<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Playlist Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 앨범 커버 이미지를 카드 크기에 맞게 조정 */
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" href="/">Playlist Shop</a>
        <div class="d-flex text-white align-items-center">
            <div sec:authorize="isAnonymous()">
                <button class="btn btn-outline-light me-2" onclick="location.href='/login'">로그인</button>
                <button class="btn btn-warning" onclick="location.href='/join'">회원가입</button>
            </div>
            <div sec:authorize="isAuthenticated()">
                <span class="me-3"><span sec:authentication="name" class="fw-bold text-warning">User</span>님 환영합니다!</span>
                <button class="btn btn-outline-light btn-sm" onclick="location.href='/logout'">로그아웃</button>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">추천 음악 목록</h2>

    <div class="row row-cols-1 row-cols-md-3 g-4">

        <div class="col" th:each="song : ${songs}">
            <div class="card h-100 shadow-sm">
                <img th:src="${song.albumartUrl}" class="card-img-top" alt="앨범아트">

                <div class="card-body">
                    <h5 class="card-title" th:text="${song.title}">노래 제목</h5>
                    <p class="card-text text-muted" th:text="${song.artist}">가수 이름</p>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-primary" th:text="|${song.price}원|">500원</span>
                        <a href="#" class="btn btn-sm btn-outline-primary">상세보기</a>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <small class="text-muted" th:text="|앨범: ${song.album}|">앨범명</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
