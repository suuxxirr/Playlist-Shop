<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Playlist Shop - 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/header :: header}"></nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4 fw-bold">로그인</h2>

                    <form action="/login-process" method="post">

                        <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
                            닉네임 또는 비밀번호를 확인해주세요.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
                            로그아웃 되었습니다.
                        </div>

                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="닉네임" required>
                            <label for="username">닉네임</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="비밀번호" required>
                            <label for="password">비밀번호</label>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2 fs-5 fw-bold">로그인</button>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <span class="text-muted">계정이 없으신가요?</span>
                <a href="/join" class="text-decoration-none fw-bold text-warning ms-1">회원가입</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
