<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Playlist Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">

    <div class="p-5 mb-4 bg-light rounded-3 border">
        <div class="container-fluid py-2">
            <span class="badge bg-primary mb-2">Playlist</span>
            <h1 class="display-5 fw-bold" th:text="${playlist.title}">플레이리스트 제목</h1>
            <p class="col-md-8 fs-4 text-muted">
                <i class="bi bi-person-fill"></i> Created by <span th:text="${playlist.user.nickname}" class="text-dark fw-bold">User</span>
            </p>
            <p class="lead" th:text="${playlist.description}">플레이리스트 설명이 여기에 나옵니다.</p>

            <hr class="my-4">

            <div class="d-flex gap-2">
                <a href="/playlist" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> 목록으로
                </a>
            </div>
        </div>
    </div>

    <h3 class="fw-bold mb-3">수록곡 리스트 (<span th:text="${#lists.size(playlist.playlistSongs)}">0</span>곡)</h3>

    <table class="table table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th scope="col" style="width: 5%;">#</th>
            <th scope="col" style="width: 10%;"></th>
            <th scope="col" style="width: 40%;">제목</th>
            <th scope="col" style="width: 30%;">가수</th>
            <th scope="col" style="width: 15%;">앨범</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ps, stat : ${playlist.playlistSongs}">
            <td th:text="${stat.count}">1</td>
            <td>
                <div th:if="${ps.song.albumartUrl != null}">
                    <img th:src="${ps.song.albumartUrl}" alt="album" style="width: 50px; height: 50px; object-fit: cover;" class="rounded">
                </div>
                <div th:unless="${ps.song.albumartUrl != null}" class="bg-secondary rounded d-flex justify-content-center align-items-center" style="width: 50px; height: 50px;">
                    <i class="bi bi-music-note text-white"></i>
                </div>
            </td>
            <td class="fw-bold" th:text="${ps.song.title}">노래 제목</td>
            <td th:text="${ps.song.artist}">가수</td>
            <td th:text="${ps.song.album}">앨범명</td>
        </tr>
        </tbody>
    </table>

    <div th:if="${playlist.playlistSongs.isEmpty()}" class="text-center py-5">
        <p class="text-muted">수록된 곡이 없습니다.</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
