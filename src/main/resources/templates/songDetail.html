<div th:replace="~{fragments/header :: header}"></div>

<div class="container">

    <div class="row align-items-center mb-5">
        <div class="col-md-5 text-center">
            <img th:src="${song.albumartUrl}" class="album-art-large mb-3" alt="앨범아트">
        </div>

        <div class="col-md-7">
            <span class="badge bg-secondary mb-2" th:text="${song.album}">앨범명</span>
            <h1 class="fw-bold display-4 mb-2" th:text="${song.title}">노래 제목</h1>
            <h3 class="text-muted mb-4" th:text="${song.artist}">가수 이름</h3>

            <h2 class="text-primary fw-bold mb-4" th:text="|${song.price}원|">가격</h2>

            <div class="d-flex gap-2">
                <button class="btn btn-outline-danger btn-lg"
                        th:onclick="|location.href='@{/like/{id}(id=${song.id})}'|">
                    ❤️ <span th:text="${song.likeCount}">0</span>
                </button>

                <button class="btn btn-primary btn-lg px-4"
                        th:onclick="|location.href='@{/cart/add/{id}(id=${song.id})}'|">
                    장바구니 담기
                </button>
            </div>
        </div>
    </div>

    <hr class="my-5">

    <div class="row">
        <div class="col-lg-8">
            <h3 class="mb-4">댓글 리뷰 <span class="badge bg-secondary" th:text="${#lists.size(comments)}">0</span></h3>

            <div class="card mb-4 bg-light">
                <div class="card-body">
                    <div sec:authorize="isAnonymous()" class="text-center py-3">
                        <a href="/login" class="fw-bold text-decoration-underline">로그인</a> 후 댓글을 남겨보세요!
                    </div>

                    <form sec:authorize="isAuthenticated()" action="/song/comment" method="post">
                        <input type="hidden" name="songId" th:value="${song.id}">

                        <div class="mb-3">
                            <label class="form-label">별점</label>
                            <select name="rating" class="form-select w-25">
                                <option value="5">⭐⭐⭐⭐⭐</option>
                                <option value="4">⭐⭐⭐⭐</option>
                                <option value="3">⭐⭐⭐ </option>
                                <option value="2">⭐⭐ </option>
                                <option value="1">⭐ </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <textarea name="content" class="form-control" rows="3" placeholder="이 노래에 대한 감상평을 남겨주세요!" required></textarea>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-dark">등록하기</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="list-group">
                <div th:if="${#lists.isEmpty(comments)}" class="text-center py-4 text-muted">
                    아직 작성된 리뷰가 없습니다. 첫 번째 리뷰를 남겨보세요!
                </div>

                <div th:each="comment : ${comments}" class="list-group-item">
                    <div class="d-flex w-100 justify-content-between">
                        <div>
                            <h6 class="mb-1 fw-bold">
                                <span th:text="${comment.user.nickname}">닉네임</span>
                                <span class="text-warning ms-2" th:text="${'⭐'.repeat(comment.rating)}">⭐⭐⭐⭐⭐</span>
                            </h6>
                        </div>
                        <small class="text-muted" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">2023-10-25</small>
                    </div>
                    <p class="mb-1 mt-2" th:text="${comment.content}">내용</p>
                    <div class="mt-2 d-flex justify-content-end" th:if="${#authentication.name == comment.user.nickname}">
                        <a th:href="@{/song/comment/delete/{id}(id=${comment.id}, songId=${song.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('정말 삭제하시겠습니까?')">삭제</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
